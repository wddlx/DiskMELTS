# Tests, documentation, FITS reading, and JupyterLab. Run from the repository root.
name: diskmelts-dev
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - -e .[dev,io,notebooks]
      # Production checkpoints contain scikit-learn 1.8.0 PCA/scaler objects.
      - scikit-learn==1.8.0
