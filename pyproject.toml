[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diskmelts"
version = "0.1.0"
description = "Machine-learning Enabled Line fitting Tool for Spectra of protoplanetary disks"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Chengyan Xie" },
    { name = "Dingshan Deng" },
]
keywords = ["astronomy", "protoplanetary disks", "JWST", "spectral fitting", "machine learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "torch",
    # Intel macOS wheels stop at PyTorch 2.2, whose NumPy bridge needs NumPy 1.x.
    "numpy>=1.26,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
]

[project.optional-dependencies]
io = ["astropy"]
dev = ["pytest", "sphinx", "furo", "myst-parser", "sphinx-design",
       "nbsphinx", "nbsphinx-link"]
notebooks = ["jupyterlab", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
diskmelts = ["models/Trained_model/*/*.pt", "models/Trained_model/*/*.json",
            "consub/*.csv", "consub/regions/*.csv", "consub/regions/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
