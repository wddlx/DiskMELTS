[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diskmelts"
version = "2.2.2"
description = "Machine-learning Enabled Line fitting Tool for Spectra of protoplanetary disks"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Chengyan Xie" },
    { name = "Dingshan Deng" },
]
keywords = ["astronomy", "protoplanetary disks", "JWST", "spectral fitting", "machine learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    # Checkpoints load with torch.load(weights_only=True), added in 1.13.
    "torch>=1.13",
    # Intel macOS wheels stop at PyTorch 2.2, whose NumPy bridge needs NumPy 1.x.
    "numpy>=1.26,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "pandas",
    "scipy",
    # Used only to fit PCA/scalers when training; checkpoints store plain arrays.
    "scikit-learn>=1.0",
    "matplotlib",
    # Ensemble MCMC for posterior error bars (pure Python, NumPy only).
    "emcee>=3",
]

[project.urls]
Homepage = "https://github.com/wddlx/DiskMELTS"
Documentation = "https://diskmelts.readthedocs.io/en/latest/"
Repository = "https://github.com/wddlx/DiskMELTS"
Issues = "https://github.com/wddlx/DiskMELTS/issues"

[project.optional-dependencies]
io = ["astropy"]
dev = ["pytest", "sphinx", "furo", "myst-parser", "sphinx-design",
       "nbsphinx", "nbsphinx-link"]
notebooks = ["jupyterlab", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
diskmelts = ["models/Trained_model/sigma*/*/*.pt", "models/Trained_model/sigma*/*/*.json",
            "consub/*.csv", "consub/regions/*.csv", "consub/regions/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
