# Core package plus FITS reading and JupyterLab. Run from the repository root.
name: diskmelts-notebooks
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - -e .[io,notebooks]
      # Production checkpoints contain scikit-learn 1.8.0 PCA/scaler objects.
      - scikit-learn==1.8.0
